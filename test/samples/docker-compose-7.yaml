# Reverse Proxy & Zero-Trust Gateway (Traefik + sample services with labels & middlewares)
version: "3.9"

networks:
  public:
    driver: bridge
  internal:
    driver: bridge

services:
  traefik:
    image: traefik:3.0
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "8089:80"
      - "8889:8080" # dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public
      - internal
    healthcheck:
      test: ["CMD", "traefik", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  whoami-one:
    image: containous/whoami:v1.5.0
    labels:
      traefik.enable: "true"
      traefik.http.routers.whoami-one.rule: Host(`whoami.localhost`)
      traefik.http.routers.whoami-one.entrypoints: web
      traefik.http.middlewares.strip-sec.headers.customresponseheaders.X-Powered-By: hidden
      traefik.http.routers.whoami-one.middlewares: strip-sec
    networks:
      - internal
      - public
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  whoami-two:
    image: containous/whoami:v1.5.0
    labels:
      traefik.enable: "true"
      traefik.http.routers.whoami-two.rule: Host(`whoami2.localhost`)
      traefik.http.routers.whoami-two.entrypoints: web
      traefik.http.services.whoami-two.loadbalancer.server.port: "80"
    networks:
      - internal
      - public

  secure-api:
    image: ealen/echo-server:latest
    labels:
      traefik.enable: "true"
      traefik.http.routers.secure-api.rule: Host(`api.localhost`) && PathPrefix(`/v1`)
      traefik.http.routers.secure-api.entrypoints: web
      traefik.http.middlewares.secure-chain.headers.stsSeconds: "31536000"
      traefik.http.middlewares.secure-chain.headers.forceSTSHeader: "true"
      traefik.http.routers.secure-api.middlewares: secure-chain
    networks:
      - internal
