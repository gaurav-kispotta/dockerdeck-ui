# stress-test.yaml
# Large-scale docker-compose stress test for DockerDeck visualizer.
# Covers: many services, deep dependency chains, multiple networks,
# many volumes, mixed node types, and complex boot-order ranks.
#
# Boot-order rank summary (topological levels):
#   Rank 0 — infra: zookeeper, redis-master, postgres-primary, mysql-primary, minio, vault, consul
#   Rank 1 — replication & brokers: kafka-broker-1, kafka-broker-2, redis-replica-1,
#             redis-replica-2, postgres-replica, mysql-replica, schema-registry
#   Rank 2 — stream processors & caches: kafka-connect, ksqldb, spark-master, memcached
#   Rank 3 — data services: spark-worker-1, spark-worker-2, elasticsearch, opensearch
#   Rank 4 — search & analytics: kibana, opensearch-dashboards, logstash
#   Rank 5 — service mesh: api-gateway, auth-service, config-server, service-discovery
#   Rank 6 — microservices: user-service, order-service, inventory-service,
#             notification-service, payment-service
#   Rank 7 — front-of-house: frontend, bff-service, websocket-server
#   Rank 8 — observability: prometheus, node-exporter, cadvisor
#   Rank 9 — dashboards: grafana, alertmanager

version: "3.9"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  infra-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

  data-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

  stream-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24

  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24

  observability-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/24

  front-tier:
    driver: bridge

  back-tier:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  zookeeper_data: {}
  zookeeper_log: {}
  kafka_broker1_data: {}
  kafka_broker2_data: {}
  postgres_primary_data: {}
  postgres_replica_data: {}
  mysql_primary_data: {}
  mysql_replica_data: {}
  redis_master_data: {}
  redis_replica1_data: {}
  redis_replica2_data: {}
  minio_data: {}
  vault_data: {}
  consul_data: {}
  elasticsearch_data: {}
  opensearch_data: {}
  logstash_pipeline: {}
  spark_master_data: {}
  spark_worker1_data: {}
  spark_worker2_data: {}
  prometheus_data: {}
  grafana_data: {}
  alertmanager_data: {}
  memcached_data: {}

# ── x-common anchors ──────────────────────────────────────────────────────────
x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ──────────────────────────────────────────────────────────────────
  # Rank 0 — Infrastructure foundation (no dependencies)
  # ──────────────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: stress-zookeeper
    hostname: zookeeper
    <<: [*restart, *logging]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - infra-net
      - stream-net
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-master:
    image: redis:7.2-alpine
    container_name: stress-redis-master
    hostname: redis-master
    <<: [*restart, *logging]
    command: redis-server --appendonly yes --requirepass stresstest
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    networks:
      - infra-net
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "stresstest", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres-primary:
    image: postgres:16-alpine
    container_name: stress-postgres-primary
    hostname: postgres-primary
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB: stressdb
      POSTGRES_USER: stress
      POSTGRES_PASSWORD: stresspass
      POSTGRES_REPLICATION_MODE: master
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    networks:
      - infra-net
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stress -d stressdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-primary:
    image: mysql:8.0
    container_name: stress-mysql-primary
    hostname: mysql-primary
    <<: [*restart, *logging]
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: stressdb
      MYSQL_USER: stress
      MYSQL_PASSWORD: stresspass
    command: --server-id=1 --log-bin=mysql-bin --binlog-format=ROW
    ports:
      - "3306:3306"
    volumes:
      - mysql_primary_data:/var/lib/mysql
    networks:
      - infra-net
      - data-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "stress", "-pstresspass"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: stress-minio
    hostname: minio
    <<: [*restart, *logging]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - infra-net
      - data-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.15
    container_name: stress-vault
    hostname: vault
    <<: [*restart, *logging]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: stresstoken
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
    networks:
      - infra-net
      - app-net
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: consul:1.17
    container_name: stress-consul
    hostname: consul
    <<: [*restart, *logging]
    command: agent -dev -client 0.0.0.0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul_data:/consul/data
    networks:
      - infra-net
      - app-net
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────
  # Rank 1 — Replication layer & Kafka brokers
  # ──────────────────────────────────────────────────────────────────

  kafka-broker-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: stress-kafka-broker-1
    hostname: kafka-broker-1
    <<: [*restart, *logging]
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-1:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka_broker1_data:/var/lib/kafka/data
    networks:
      - infra-net
      - stream-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-broker-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: stress-kafka-broker-2
    hostname: kafka-broker-2
    <<: [*restart, *logging]
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-2:9093,EXTERNAL://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "29093:29093"
    volumes:
      - kafka_broker2_data:/var/lib/kafka/data
    networks:
      - infra-net
      - stream-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9093 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis-replica-1:
    image: redis:7.2-alpine
    container_name: stress-redis-replica-1
    hostname: redis-replica-1
    <<: [*restart, *logging]
    depends_on:
      redis-master:
        condition: service_healthy
    command: redis-server --replicaof redis-master 6379 --requirepass stresstest --masterauth stresstest
    ports:
      - "6380:6379"
    volumes:
      - redis_replica1_data:/data
    networks:
      - infra-net
      - data-net

  redis-replica-2:
    image: redis:7.2-alpine
    container_name: stress-redis-replica-2
    hostname: redis-replica-2
    <<: [*restart, *logging]
    depends_on:
      redis-master:
        condition: service_healthy
    command: redis-server --replicaof redis-master 6379 --requirepass stresstest --masterauth stresstest
    ports:
      - "6381:6379"
    volumes:
      - redis_replica2_data:/data
    networks:
      - infra-net
      - data-net

  postgres-replica:
    image: postgres:16-alpine
    container_name: stress-postgres-replica
    hostname: postgres-replica
    <<: [*restart, *logging]
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRES_DB: stressdb
      POSTGRES_USER: stress
      POSTGRES_PASSWORD: stresspass
      POSTGRES_REPLICATION_MODE: slave
      POSTGRES_MASTER_HOST: postgres-primary
      POSTGRES_MASTER_PORT_NUMBER: 5432
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    networks:
      - infra-net
      - data-net

  mysql-replica:
    image: mysql:8.0
    container_name: stress-mysql-replica
    hostname: mysql-replica
    <<: [*restart, *logging]
    depends_on:
      mysql-primary:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: stressdb
    command: --server-id=2 --log-bin=mysql-bin --binlog-format=ROW --relay-log=relay-bin
    ports:
      - "3307:3306"
    volumes:
      - mysql_replica_data:/var/lib/mysql
    networks:
      - infra-net
      - data-net

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: stress-schema-registry
    hostname: schema-registry
    <<: [*restart, *logging]
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-broker-1:9092,kafka-broker-2:9093
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    networks:
      - stream-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────────────
  # Rank 2 — Stream processors & in-memory cache
  # ──────────────────────────────────────────────────────────────────

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.5.0
    container_name: stress-kafka-connect
    hostname: kafka-connect
    <<: [*restart, *logging]
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka-broker-1:9092,kafka-broker-2:9093
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: stress-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "8083:8083"
    networks:
      - stream-net
      - data-net

  ksqldb:
    image: confluentinc/cp-ksqldb-server:7.5.0
    container_name: stress-ksqldb
    hostname: ksqldb
    <<: [*restart, *logging]
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka-broker-1:9092,kafka-broker-2:9093
      KSQL_KSQL_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
    ports:
      - "8088:8088"
    networks:
      - stream-net

  spark-master:
    image: bitnami/spark:3.5
    container_name: stress-spark-master
    hostname: spark-master
    <<: [*restart, *logging]
    depends_on:
      - kafka-broker-1
      - kafka-broker-2
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - spark_master_data:/opt/bitnami/spark/work
    networks:
      - stream-net
      - data-net

  memcached:
    image: memcached:1.6-alpine
    container_name: stress-memcached
    hostname: memcached
    <<: [*restart, *logging]
    depends_on:
      - redis-master
    command: memcached -m 256 -p 11211 -c 1024
    ports:
      - "11211:11211"
    networks:
      - data-net
      - app-net

  # ──────────────────────────────────────────────────────────────────
  # Rank 3 — Data services
  # ──────────────────────────────────────────────────────────────────

  spark-worker-1:
    image: bitnami/spark:3.5
    container_name: stress-spark-worker-1
    hostname: spark-worker-1
    <<: [*restart, *logging]
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: 1
    volumes:
      - spark_worker1_data:/opt/bitnami/spark/work
    networks:
      - stream-net

  spark-worker-2:
    image: bitnami/spark:3.5
    container_name: stress-spark-worker-2
    hostname: spark-worker-2
    <<: [*restart, *logging]
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: 1
    volumes:
      - spark_worker2_data:/opt/bitnami/spark/work
    networks:
      - stream-net

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: stress-elasticsearch
    hostname: elasticsearch
    <<: [*restart, *logging]
    depends_on:
      - kafka-connect
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - data-net
      - observability-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: stress-opensearch
    hostname: opensearch
    <<: [*restart, *logging]
    depends_on:
      - kafka-connect
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      plugins.security.disabled: "true"
    ports:
      - "9201:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - data-net
      - observability-net

  # ──────────────────────────────────────────────────────────────────
  # Rank 4 — Search UIs & log processing
  # ──────────────────────────────────────────────────────────────────

  kibana:
    image: kibana:8.11.0
    container_name: stress-kibana
    hostname: kibana
    <<: [*restart, *logging]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - data-net
      - observability-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: stress-opensearch-dashboards
    hostname: opensearch-dashboards
    <<: [*restart, *logging]
    depends_on:
      - opensearch
    environment:
      OPENSEARCH_HOSTS: http://opensearch:9200
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5602:5601"
    networks:
      - data-net
      - observability-net

  logstash:
    image: logstash:8.11.0
    container_name: stress-logstash
    hostname: logstash
    <<: [*restart, *logging]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - logstash_pipeline:/usr/share/logstash/pipeline
    ports:
      - "5044:5044"
      - "9600:9600"
    networks:
      - data-net
      - stream-net
      - observability-net

  # ──────────────────────────────────────────────────────────────────
  # Rank 5 — Service mesh: gateway, auth, config, discovery
  # ──────────────────────────────────────────────────────────────────

  service-discovery:
    image: netflix/eureka:latest
    container_name: stress-service-discovery
    hostname: service-discovery
    <<: [*restart, *logging]
    depends_on:
      - consul
      - vault
    environment:
      EUREKA_SERVER: "true"
      EUREKA_PORT: 8761
    ports:
      - "8761:8761"
    networks:
      - app-net
      - infra-net

  config-server:
    image: hyness/spring-cloud-config-server:3.1.8-jre17
    container_name: stress-config-server
    hostname: config-server
    <<: [*restart, *logging]
    depends_on:
      - vault
      - consul
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: /config
    ports:
      - "8888:8888"
    networks:
      - app-net
      - infra-net

  auth-service:
    image: keycloak/keycloak:23.0
    container_name: stress-auth-service
    hostname: auth-service
    <<: [*restart, *logging]
    depends_on:
      postgres-primary:
        condition: service_healthy
      vault:
        condition: service_healthy
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-primary:5432/stressdb
      KC_DB_USERNAME: stress
      KC_DB_PASSWORD: stresspass
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
    ports:
      - "8180:8080"
    networks:
      - app-net
      - data-net

  api-gateway:
    image: nginx:1.25-alpine
    container_name: stress-api-gateway
    hostname: api-gateway
    <<: [*restart, *logging]
    depends_on:
      - auth-service
      - config-server
      - service-discovery
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-net
      - front-tier
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────────────────────────
  # Rank 6 — Microservices
  # ──────────────────────────────────────────────────────────────────

  user-service:
    image: node:20-alpine
    container_name: stress-user-service
    hostname: user-service
    <<: [*restart, *logging]
    depends_on:
      - api-gateway
      - auth-service
      postgres-primary:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    working_dir: /app
    command: sh -c "echo 'user-service running' && sleep infinity"
    environment:
      DB_HOST: postgres-primary
      DB_PORT: 5432
      DB_NAME: stressdb
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      AUTH_URL: http://auth-service:8080
    ports:
      - "3001:3000"
    networks:
      - app-net
      - data-net

  order-service:
    image: node:20-alpine
    container_name: stress-order-service
    hostname: order-service
    <<: [*restart, *logging]
    depends_on:
      - api-gateway
      - user-service
      - kafka-broker-1
      postgres-primary:
        condition: service_healthy
    working_dir: /app
    command: sh -c "echo 'order-service running' && sleep infinity"
    environment:
      DB_HOST: postgres-primary
      KAFKA_BROKERS: kafka-broker-1:9092,kafka-broker-2:9093
      USER_SERVICE_URL: http://user-service:3000
    ports:
      - "3002:3000"
    networks:
      - app-net
      - stream-net
      - data-net

  inventory-service:
    image: node:20-alpine
    container_name: stress-inventory-service
    hostname: inventory-service
    <<: [*restart, *logging]
    depends_on:
      - api-gateway
      mysql-primary:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    working_dir: /app
    command: sh -c "echo 'inventory-service running' && sleep infinity"
    environment:
      DB_HOST: mysql-primary
      DB_PORT: 3306
      REDIS_HOST: redis-master
    ports:
      - "3003:3000"
    networks:
      - app-net
      - data-net

  notification-service:
    image: node:20-alpine
    container_name: stress-notification-service
    hostname: notification-service
    <<: [*restart, *logging]
    depends_on:
      - api-gateway
      - kafka-broker-1
      - kafka-broker-2
      - user-service
    working_dir: /app
    command: sh -c "echo 'notification-service running' && sleep infinity"
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092,kafka-broker-2:9093
      USER_SERVICE_URL: http://user-service:3000
    ports:
      - "3004:3000"
    networks:
      - app-net
      - stream-net

  payment-service:
    image: node:20-alpine
    container_name: stress-payment-service
    hostname: payment-service
    <<: [*restart, *logging]
    depends_on:
      - api-gateway
      - order-service
      postgres-primary:
        condition: service_healthy
      vault:
        condition: service_healthy
    working_dir: /app
    command: sh -c "echo 'payment-service running' && sleep infinity"
    environment:
      DB_HOST: postgres-primary
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: stresstoken
    ports:
      - "3005:3000"
    networks:
      - app-net
      - data-net

  # ──────────────────────────────────────────────────────────────────
  # Rank 7 — Front-of-house
  # ──────────────────────────────────────────────────────────────────

  bff-service:
    image: node:20-alpine
    container_name: stress-bff-service
    hostname: bff-service
    <<: [*restart, *logging]
    depends_on:
      - api-gateway
      - user-service
      - order-service
      - inventory-service
      - payment-service
    working_dir: /app
    command: sh -c "echo 'bff-service running' && sleep infinity"
    environment:
      USER_SERVICE: http://user-service:3000
      ORDER_SERVICE: http://order-service:3000
      INVENTORY_SERVICE: http://inventory-service:3000
      PAYMENT_SERVICE: http://payment-service:3000
    ports:
      - "4000:4000"
    networks:
      - app-net
      - front-tier

  websocket-server:
    image: node:20-alpine
    container_name: stress-websocket-server
    hostname: websocket-server
    <<: [*restart, *logging]
    depends_on:
      - api-gateway
      - notification-service
      redis-master:
        condition: service_healthy
    working_dir: /app
    command: sh -c "echo 'websocket-server running' && sleep infinity"
    environment:
      REDIS_HOST: redis-master
      NOTIFICATION_SERVICE: http://notification-service:3000
    ports:
      - "4001:4001"
    networks:
      - app-net
      - front-tier

  frontend:
    image: nginx:1.25-alpine
    container_name: stress-frontend
    hostname: frontend
    <<: [*restart, *logging]
    depends_on:
      - bff-service
      - websocket-server
      api-gateway:
        condition: service_healthy
    ports:
      - "8090:80"
    networks:
      - front-tier

  # ──────────────────────────────────────────────────────────────────
  # Rank 8 — Observability collectors
  # ──────────────────────────────────────────────────────────────────

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: stress-node-exporter
    hostname: node-exporter
    <<: *restart
    depends_on:
      - api-gateway
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - observability-net
      - back-tier

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: stress-cadvisor
    hostname: cadvisor
    <<: *restart
    depends_on:
      - api-gateway
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8089:8080"
    networks:
      - observability-net
      - back-tier

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: stress-prometheus
    hostname: prometheus
    <<: [*restart, *logging]
    depends_on:
      - node-exporter
      - cadvisor
      - elasticsearch
      - kafka-broker-1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-admin-api
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability-net
      - back-tier
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────
  # Rank 9 — Dashboards & alerting
  # ──────────────────────────────────────────────────────────────────

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: stress-alertmanager
    hostname: alertmanager
    <<: [*restart, *logging]
    depends_on:
      prometheus:
        condition: service_healthy
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - observability-net

  grafana:
    image: grafana/grafana:10.2.0
    container_name: stress-grafana
    hostname: grafana
    <<: [*restart, *logging]
    depends_on:
      prometheus:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      opensearch:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - observability-net
      - front-tier
