version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: my-postgres
    ports:
      - "5432:5432"
    networks:
      - backend

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: my-mysql
    ports:
      - "3306:3306"
    networks:
      - backend

  # MongoDB Database
  mongodb:
    image: mongodb:7.0
    container_name: my-mongo
    ports:
      - "27017:27017"
    networks:
      - backend

  # Redis Cache
  redis:
    image: redis:7.2
    container_name: my-redis
    ports:
      - "6379:6379"
    networks:
      - backend

  # Node.js API
  api:
    image: node:20
    container_name: my-api
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - backend
      - frontend

  # Nginx Web Server
  nginx:
    image: nginx:latest
    container_name: my-nginx
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - frontend

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
